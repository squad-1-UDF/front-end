name: Front-end checks

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Node tests
        run: node --test tests/api-contract.test.cjs
      - name: JavaScript syntax
        run: |
          find js -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check tests/api-contract.test.cjs
      - name: Python syntax
        run: python -c "import ast, pathlib; ast.parse(pathlib.Path('dev_server.py').read_text(encoding='utf-8'))"
